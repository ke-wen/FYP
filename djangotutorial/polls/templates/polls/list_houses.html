<h1>List of Houses</h1>
<ul>
    {% for house in houses %}
        <li>
            Address: {{ house.address }}<br>
            Price: €{{ house.price }}<br>
            Date of Sale: {{ house.date_of_sale|date:"d M Y" }}<br>
            County: {{ house.county }}<br>
            Description: {{ house.description_of_property }}
        </li>
    {% endfor %}
</ul>
