{% load static %}
<link rel="stylesheet" href="{% static 'polls/style.css' %}">
<a href="{% url 'polls:list_houses' %}" class="btn btn-primary">View All Houses</a>
<a href="{% url 'polls:show_data' %}" class="btn btn-secondary">View Dublin1 Data</a>
{% if latest_housesprice_list %}
    <ul>
    {% for house in latest_housesprice_list %}
        <li>
            Address: {{ house.eircode }}<br>
            Price: €{{ house.value }}<br>
            Date of Sale: {{ house.month }}<br>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No houses are available.</p>
{% endif %}
